; .user.ini — áp dụng khi hosting chạy PHP-FPM (phổ biến trên hosting chia sẻ/cPanel).
; Nếu hosting dùng Apache + mod_php, cần nhờ nhà cung cấp hosting chỉnh trực tiếp
; trong php.ini hoặc .htaccess (php_value upload_max_filesize / post_max_size),
; vì .user.ini không có tác dụng với mod_php.
upload_max_filesize = 500M
post_max_size = 500M
memory_limit = 640M
max_execution_time = 300
max_input_time = 300
